name: Vortex Index

on:
  push:
    branches:
      - develop
      - feat/vortex-index
  # Shared Vortex crates can affect index behavior, so do not filter by path.
  pull_request: { }
  workflow_dispatch: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 4
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  index:
    name: Index (all features)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Uses the stable version pinned in rust-toolchain.toml, including Clippy.
      - uses: ./.github/actions/setup-rust

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: vortex-index-all-features
          cache-on-failure: true

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libclang-dev pkg-config
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isystem $(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      # Defaults are empty: all-features enables file, local-store and their
      # cross-process persistence tests. cargo test also runs Rust doctests.
      - name: Run index tests (all features)
        run: cargo test --locked -p vortex-index --all-features

      - name: Run index Clippy (all targets, all features)
        run: cargo clippy --locked -p vortex-index --all-targets --all-features -- -D warnings

      - name: Test backend without native dependencies
        run: cargo test --locked -p vortex-index-spfresh --no-default-features

      - name: Test hnswlib metadata without native dependencies
        run: cargo test --locked -p vortex-index-hnswlib --no-default-features

  sql-index:
    name: Index SQL adapter (no native backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-rust
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: vortex-index-sql
          cache-on-failure: true
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libclang-dev pkg-config
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isystem $(gcc -print-file-name=include)" >> "$GITHUB_ENV"
      - name: Test SQL adapter with persisted reference backend
        run: cargo test --locked -p vortex-duckdb --features index index::tests
      - name: SQL adapter Clippy
        run: cargo clippy --locked -p vortex-duckdb --all-targets --features index -- -D warnings

  spfresh:
    name: SPFresh (real native, Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: ./.github/actions/setup-rust

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: vortex-index-spfresh-native-v1
          cache-on-failure: true

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libzstd-dev libclang-dev pkg-config
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isystem $(gcc -print-file-name=include)" >> "$GITHUB_ENV"

      # No restored native binaries: compile the pinned source and explicit patch,
      # link a shared bridge to prove PIC, and build the real fixture generator.
      - name: Build pinned SPFresh
        run: |
          bash vortex-index-spfresh/native/build.sh
          echo "VORTEX_SPFRESH_NATIVE=$PWD/target/spfresh-native/build" >> "$GITHUB_ENV"

      - name: Native parity, persistence and lifetime tests
        run: cargo test --locked -p vortex-index-spfresh --all-features

      - name: Repeat native lifetime tests
        run: |
          for iteration in 1 2 3 4 5; do
            cargo test --locked -p vortex-index-spfresh --all-features test_concurrent_handles_repeat_and_lease_lifetime
          done

      - name: Native Clippy
        run: cargo clippy --locked -p vortex-index-spfresh --all-targets --all-features -- -D warnings

  hnswlib:
    name: hnswlib (real native, Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-rust
      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: vortex-index-hnswlib-native-v1
          cache-on-failure: true
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ libclang-dev pkg-config
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isystem $(gcc -print-file-name=include)" >> "$GITHUB_ENV"
      - name: Fetch pinned hnswlib
        run: |
          git clone https://github.com/nmslib/hnswlib.git target/hnswlib-source
          git -C target/hnswlib-source checkout --detach d9b3608c83d83b46c96e25088cb1d729b29dcfe9
          echo "VORTEX_HNSWLIB_SOURCE=$PWD/target/hnswlib-source" >> "$GITHUB_ENV"
      - name: Native concurrency regression (ThreadSanitizer)
        run: |
          work=$(mktemp -d)
          c++ -std=c++17 -O1 -g -fsanitize=thread -fno-omit-frame-pointer \
            -mavx2 -mfma -mf16c -pthread -I "$VORTEX_HNSWLIB_SOURCE" \
            vortex-index-hnswlib/native/bridge.cpp \
            vortex-index-hnswlib/native/tests/concurrency.cpp -o "$work/concurrency"
          # Disable only the upstream serial-build lock-order detector, not race detection.
          # Disable ASLR for this process to avoid GCC TSan shadow-memory conflicts.
          TSAN_OPTIONS=halt_on_error=1:detect_deadlocks=0 \
            setarch x86_64 -R "$work/concurrency" "$work"
      - name: Build, reload, parity and native structure tests
        run: cargo test --locked -p vortex-index-hnswlib --all-features --all-targets
      - name: Native Clippy
        run: cargo clippy --locked -p vortex-index-hnswlib --all-targets --all-features -- -D warnings
